dataset: location_master
canonical_fields:
  # ---- Identifiers ----
  - name: location_id
    type: string
    required: true
    description: Unique location identifier
    optilogic_field: FacilityName
  - name: location_name
    type: string
    required: true
    description: Location display name
    optilogic_field: FacilityName
  - name: location_type
    type: string
    required: false
    description: Type of location (Plant, DC, Warehouse, Port, Cross-dock, Store)
    optilogic_field: FacilityType
  - name: location_status
    type: string
    required: false
    description: Active / Inactive / Closed
  - name: company_code
    type: string
    required: false
    description: ERP company/plant code
  # ---- Contact ----
  - name: contact_name
    type: string
    required: false
    description: Site contact
  - name: phone
    type: string
    required: false
    description: Facility phone number
  - name: email
    type: string
    required: false
    description: Facility email address
  # ---- Address ----
  - name: address_line_1
    type: string
    required: false
    description: Street address line 1
  - name: address_line_2
    type: string
    required: false
    description: Street address line 2 / Suite / Unit
  - name: city
    type: string
    required: true
    description: City
    optilogic_field: City
  - name: state
    type: string
    required: true
    description: State/Province
    optilogic_field: State
  - name: postal_code
    type: string
    required: true
    description: Postal/Zip code
    optilogic_field: PostalCode
  - name: country
    type: string
    required: true
    description: Country
    optilogic_field: Country
  - name: region
    type: string
    required: false
    description: Geographic/distribution region
  - name: latitude
    type: float
    required: false
    description: Geocoded latitude
    optilogic_field: Latitude
  - name: longitude
    type: float
    required: false
    description: Geocoded longitude
    optilogic_field: Longitude
  # ---- Facility attributes ----
  - name: storage_capacity
    type: float
    required: false
    description: Total storage capacity (units or sq ft)
  - name: capacity_uom
    type: string
    required: false
    description: Unit of measure for capacity
  - name: throughput_capacity
    type: float
    required: false
    description: Maximum throughput per day
  - name: operating_days_per_week
    type: float
    required: false
    description: Days per week the facility is operational
  - name: fixed_cost
    type: float
    required: false
    description: Annual fixed operating cost
  - name: variable_cost_per_unit
    type: float
    required: false
    description: Variable handling cost per unit
  - name: currency
    type: string
    required: false
    description: Currency for cost fields
  - name: open_date
    type: date
    required: false
    description: Facility open/activation date
  - name: close_date
    type: date
    required: false
    description: Facility close date (if applicable)
  - name: created_date
    type: date
    required: false
    description: Record creation date
