dataset: vendor_master
canonical_fields:
  # ---- Identifiers ----
  - name: vendor_id
    type: string
    required: true
    description: Unique vendor identifier
    optilogic_field: VendorName
  - name: vendor_name
    type: string
    required: true
    description: Vendor display name
    optilogic_field: VendorName
  - name: vendor_number
    type: string
    required: false
    description: Vendor account number (alternative ID)
  - name: vendor_type
    type: string
    required: false
    description: Supplier type (Manufacturer, Distributor, 3PL, Carrier)
  - name: vendor_status
    type: string
    required: false
    description: Active / Inactive / On Hold
  - name: carrier_flag
    type: string
    required: false
    description: Is this vendor also a carrier? Y/N
  # ---- Contact ----
  - name: contact_name
    type: string
    required: false
    description: Primary contact person
  - name: phone
    type: string
    required: false
    description: Primary phone number
  - name: email
    type: string
    required: false
    description: Primary email address
  # ---- Address ----
  - name: address_line_1
    type: string
    required: false
    description: Street address line 1
  - name: address_line_2
    type: string
    required: false
    description: Street address line 2
  - name: city
    type: string
    required: true
    description: City
    optilogic_field: City
  - name: state
    type: string
    required: true
    description: State/Province
    optilogic_field: State
  - name: postal_code
    type: string
    required: true
    description: Postal/Zip code
    optilogic_field: PostalCode
  - name: country
    type: string
    required: true
    description: Country
    optilogic_field: Country
  - name: region
    type: string
    required: false
    description: Geographic region
  - name: latitude
    type: float
    required: false
    description: Geocoded latitude
    optilogic_field: Latitude
  - name: longitude
    type: float
    required: false
    description: Geocoded longitude
    optilogic_field: Longitude
  # ---- Business attributes ----
  - name: payment_terms
    type: string
    required: false
    description: Standard payment terms
  - name: currency
    type: string
    required: false
    description: Vendor currency code
  - name: lead_time_days
    type: float
    required: false
    description: Standard order lead time in days
  - name: minimum_order_quantity
    type: float
    required: false
    description: Minimum order quantity
  - name: service_areas
    type: string
    required: false
    description: Lanes/regions served by this vendor/carrier
  - name: created_date
    type: date
    required: false
    description: Record creation date
  - name: last_modified_date
    type: date
    required: false
    description: Record last modified date
